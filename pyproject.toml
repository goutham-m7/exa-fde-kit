[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "exa-fde-kit"
version = "0.1.0"
description = "A cited developer-support research agent and paired retrieval benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29"]
license = "MIT"

[project.scripts]
exa-fde-kit = "exa_fde_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
# Check the new public modules strictly. Older untyped modules retain their
# inferred signatures, but their pre-existing diagnostics aren't CI gates.
follow_imports = "silent"
files = [
    "src/exa_fde_kit/agent.py",
    "src/exa_fde_kit/evaluation.py",
    "src/exa_fde_kit/router.py",
    "src/exa_fde_kit/judge.py",
    "src/exa_fde_kit/stats.py",
    "src/exa_fde_kit/report_html.py",
    "src/exa_fde_kit/health.py",
    "src/exa_fde_kit/loadtest.py",
    "src/exa_fde_kit/mcp_server.py",
    "src/exa_fde_kit/monitor",
    "src/exa_fde_kit/telemetry.py",
]
