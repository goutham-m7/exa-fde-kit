name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uvx ruff@0.14.9 check .
      - run: uv run --locked --python ${{ matrix.python }} --with mypy==1.19.0 mypy
      - run: uv run --offline --locked --python ${{ matrix.python }} pytest
